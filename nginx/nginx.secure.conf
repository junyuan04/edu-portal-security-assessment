upstream web_app {
    server web-app:3000;
}

upstream api_server {
    server api-server:4000;
}

upstream frontend_app {
    server frontend:80;
}

upstream api_client_app {
    server api-client:80;
}

# [VULN-V8 FIX] Force every request to HTTPS.
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}
# [VULN-V8 FIX] Mozilla SSL Configuration Generator -- Intermediate profile
# (nginx 1.25, OpenSSL 3.x, target Firefox 27+, Android 4.4.2+, IE 11/Win7).
# Source: https://ssl-config.mozilla.org/  (generated 2026-06-15).
# TLS 1.3 cipher selection is delegated to the server-default ordering;
# TLS 1.2 uses an explicit AEAD-only suite list -- no CBC, no SHA1, no RC4,
# no MD5. Drops the previous loose `HIGH:!aNULL:!MD5` which still allowed
# CBC modes vulnerable to Lucky13 / BEAST style padding-oracle issues.

# [WAF] ModSecurity 3 + OWASP CRS v4 are already engaged at the
# http level by the owasp/modsecurity-crs:nginx-alpine base image's own
# nginx.conf, which loads /etc/modsecurity.d/setup.conf once globally.
# Re-declaring `modsecurity_rules_file` here would register every rule a
# second time and abort startup with "Rule id ... is duplicated". The
# engine mode (On / DetectionOnly / Off) is controlled by MODSEC_RULE_ENGINE
# in docker-compose.secure.yml. Per-location overrides (e.g. `modsecurity
# off` on the health endpoint below) still work.
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/myeduconnect.crt;
    ssl_certificate_key /etc/nginx/ssl/myeduconnect.key;
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers  off;
    ssl_session_timeout        1d;
    ssl_session_cache          shared:MozSSL:10m;
    ssl_session_tickets        off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://frontend_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass         http://web_app/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /rest/ {
        proxy_pass         http://api_server/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /api-client/ {
        proxy_pass         http://api_client_app/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /nginx-health {
        # Cheap health probe — skip the WAF so a flap in the CRS engine never
        # marks nginx unhealthy and triggers a restart loop.
        modsecurity off;
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
