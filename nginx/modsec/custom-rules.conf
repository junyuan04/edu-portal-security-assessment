# MyEduConnect - Custom ModSecurity rules
#
# WAF-MEC-10001
# Reject any request carrying an alg:none JWT. 
SecRule REQUEST_HEADERS:Authorization "@rx eyJhbGciOiJ[Nn]b25lI" \
    "id:10001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'WAF-MEC-10001 alg:none JWT detected in Authorization header',\
    tag:'attack-jwt',\
    tag:'OWASP_TOP_10/A02',\
    severity:'CRITICAL'"

# WAF-MEC-10002  
# Drop unauthenticated probes against /api/admin/* at the edge. The app does
# the same check in admin.middleware.js.
# This layer means scanners never reach the application at all and the
# attempt is captured in the WAF audit log.
SecRule REQUEST_URI "@rx ^/(api|rest)/admin/" \
    "id:10002,\
    phase:1,\
    chain,\
    deny,\
    status:403,\
    log,\
    msg:'WAF-MEC-10002 admin endpoint hit without Authorization header',\
    tag:'attack-access',\
    tag:'OWASP_TOP_10/A01',\
    severity:'HIGH'"
    SecRule &REQUEST_HEADERS:Authorization "@eq 0"

# WAF-MEC-10003
# Outbound (response-body) rule. The rule operates in logging mode only.

SecRule RESPONSE_HEADERS:Content-Type "@rx application/json" \
    "id:10003,\
    phase:4,\
    chain,\
    pass,\
    log,\
    auditlog,\
    msg:'WAF-MEC-10003 32-char hex hash leaked in JSON response (possible MD5)',\
    tag:'leak-credentials',\
    tag:'OWASP_TOP_10/A02',\
    severity:'WARNING'"
    SecRule RESPONSE_BODY "@rx \"password_hash\"\s*:\s*\"[0-9a-f]{32}\""



