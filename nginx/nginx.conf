
upstream web_app {
    server web-app:3000;
}

upstream api_server {
    server api-server:4000;    
}

upstream frontend_app {
    server frontend:80;
}

upstream api_client_app {
    server api-client:80;
}

server {
    listen 80;
    server_name localhost;

    # Main portal frontend
    location / {
        proxy_pass         http://frontend_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Web app API
    location /api/ {
        proxy_pass         http://web_app/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # REST API server
    location /rest/ {
        proxy_pass         http://api_server/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # API client frontend
    location /api-client/ {
        proxy_pass         http://api_client_app/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Health check
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}


