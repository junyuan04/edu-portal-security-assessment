# MyEduConnect — Docker Compose
#
# Usage:
#   cp .env.example .env   # fill in values
#   docker compose up --build
# Access:
#   Main portal  → http://localhost
#   REST API     → http://localhost/rest
#   API client   → http://localhost/api-client
#   Admin panel  → http://localhost/admin
#   SSH (V5)     → ssh root@localhost -p 2222  /  password: admin123

services:

  # MySQL
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./web-app/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./web-app/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - internal
    healthcheck:
      test:     ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout:  5s
      retries:  10

  # Web app (main portal backend)
  web-app:
    build:
      context:    ./web-app
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${SSH_PORT:-2222}:22"
    networks:
      - internal

  # API server (REST API — additional component)
  api-server:
    build:
      context:    ./api-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal

  # Frontend (main React portal)
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal

  # API client (separate REST API client)
  api-client:
    build:
      context:    ./api-client
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal

  # Nginx (reverse proxy)
  nginx:
    build:
      context:    ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - web-app
      - api-server
      - frontend
      - api-client
    networks:
      - internal

# Volumes
volumes:
  mysql_data:

# Networks
networks:
  internal:
    driver: bridge


